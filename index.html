<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SHOPnew - Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Inter',sans-serif;
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e40af);
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.logo{
  font-size:22px;
  font-weight:800;
  background:linear-gradient(90deg,#2563eb,#06b6d4);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.cliente-box{
  margin-top:8px;
  background:#f8fafc;
  padding:10px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}

.tabla-responsive{width:100%;overflow-x:auto;}

table{width:100%;margin-top:15px;border-collapse:collapse;}

th{background:#2563eb;color:#fff;padding:8px;}
td{padding:8px;border-bottom:1px solid #eee;}

td:last-child,th:last-child{text-align:right;}

img.producto-img{
  width:42px;height:42px;object-fit:cover;border-radius:6px;cursor:pointer;
}

.btn{
  margin-top:15px;width:100%;padding:10px;
  background:#2563eb;color:#fff;border:none;
}

/* ===== MODAL ===== */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:black;
  z-index:999;
  flex-direction:column;
}

.carrusel-container{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100%;
}

.modal img{
  max-width:100%;
  max-height:80vh;
  object-fit:contain;
}

/* FLECHAS */
.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:45px;height:45px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.6);
  color:white;font-size:22px;border-radius:50%;
  cursor:pointer;
}

.prev{left:10px;}
.next{right:10px;}

/* BOTÓN */
.bottom-bar{
  text-align:center;
  padding:10px;
}

.btn-cerrar{
  padding:10px 20px;
  border-radius:20px;
  background:white;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">SHOPnew</div>
<div>COTIZACIÓN</div>
</div>

<div class="cliente-box">
<div>Cliente:<br><span id="cliente"></span></div>
<div>Fecha:<br><span id="fecha"></span></div>
</div>

<div class="tabla-responsive">
<table>
<tbody id="tabla"></tbody>
</table>
</div>

<button class="btn">PDF</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

<div style="padding:15px;color:white;">
<span onclick="modal.style.display='none'">← Volver</span>
</div>

<div class="carrusel-container">
<button class="nav prev" onclick="prev()">‹</button>
<img id="imgGrande">
<button class="nav next" onclick="next()">›</button>
</div>

<div class="bottom-bar">
<button class="btn-cerrar" onclick="modal.style.display='none'">
Cerrar
</button>
</div>

</div>

<script>
const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

document.getElementById("fecha").innerText=new Date().toLocaleDateString();

let imgs=[],i=0;

function abrirModal(src){
  imgs=src.split("|");
  i=0;
  imgGrande.src=imgs[i];
  modal.style.display="flex";
}

function next(){
  i=(i+1)%imgs.length;
  imgGrande.src=imgs[i];
}

function prev(){
  i=(i-1+imgs.length)%imgs.length;
  imgGrande.src=imgs[i];
}

/* 🔥 TAP EN TODO EL FONDO (MENOS CONTENIDO) */
modal.addEventListener("click",function(e){
  if(
    e.target.id === "modal" ||
    e.target.classList.contains("carrusel-container")
  ){
    modal.style.display="none";
  }
});

fetch(url)
.then(r=>r.text())
.then(csv=>{
const filas=csv.split("\n").slice(1);

filas.forEach(f=>{
const c=f.split(",");

const img=document.createElement("img");
img.src=c[5]?.split("|")[0];
img.className="producto-img";
img.onclick=()=>abrirModal(c[5]);

const tr=document.createElement("tr");
const td=document.createElement("td");
td.appendChild(img);

tr.appendChild(td);
tabla.appendChild(tr);
});
});
</script>

</body>
</html>
