<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Marox - Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Inter',sans-serif;
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e40af);
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
  padding-bottom:6px;
}

.logo{
  font-size:22px;
  font-weight:800;
  background:linear-gradient(90deg,#2563eb,#06b6d4);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.title{font-size:14px;}

.cliente-box{
  margin-top:8px;
  background:#f8fafc;
  padding:10px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}

.tabla-responsive{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:600px;
  margin-top:15px;
  border-collapse:collapse;
}

th{
  background:#2563eb;
  color:#fff;
  padding:8px;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

td:last-child,
th:last-child{
  text-align:right;
}

.right{
  text-align:right;
}

.total{
  font-weight:bold;
  color:#2563eb;
  text-align:right;
}

img.producto-img{
  width:42px;
  height:42px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
}

.btn{
  margin-top:15px;
  width:100%;
  padding:10px;
  background:#2563eb;
  color:#fff;
  border:none;
}

/* ===== MODAL ===== */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  z-index:999;
  flex-direction:column;
  justify-content:space-between;
}

.top-bar{
  padding:15px;
  color:white;
  font-weight:600;
}

.volver{
  cursor:pointer;
}

.carrusel-container{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100%;
}

.modal img{
  max-width:100%;
  max-height:80vh;
  object-fit:contain;
}

.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.6);
  color:white;
  font-size:22px;
  border-radius:50%;
  cursor:pointer;
}

.prev{left:10px;}
.next{right:10px;}

.bottom-bar{
  text-align:center;
  padding:10px;
}

.btn-cerrar{
  padding:10px 20px;
  border-radius:20px;
  background:white;
  font-weight:bold;
  cursor:pointer;
}

/* CARDS */
.cards{display:none;}

.total-mobile{
  display:none;
  margin-top:10px;
  font-weight:bold;
  text-align:right;
  color:#2563eb;
}

@media(max-width:768px){

  .tabla-responsive{display:none;}

  .cards{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .card{
    display:flex;
    gap:8px;
    padding:8px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
  }

  .card img{
    width:50px;
    height:50px;
    object-fit:cover;
  }

  .card-info{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .card-info h4{margin:0;font-size:13px;}
  .card-info p{margin:0;font-size:11px;}

  .total-mobile{display:block;}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">Marox</div>
<div class="title">COTIZACIÓN</div>
</div>

<div class="cliente-box">
<div>Cliente:<br><span id="cliente"></span></div>
<div>Fecha:<br><span id="fecha"></span></div>
</div>

<div class="tabla-responsive">
<table>
<thead>
<tr>
<th>#</th>
<th>Img</th>
<th>Cant</th>
<th>Producto</th>
<th>Precio</th>
<th>Total</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

<tfoot>
<tr>
<td colspan="5" class="total">TOTAL</td>
<td class="total">S/ <span id="total_final">0.00</span></td>
</tr>
</tfoot>
</table>
</div>

<div class="cards" id="cards"></div>

<div class="total-mobile">
TOTAL: S/ <span id="total_mobile">0.00</span>
</div>

<button class="btn" onclick="window.print()">PDF</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

<div class="top-bar">
<span class="volver" onclick="modal.style.display='none'">← Volver a cotización</span>
</div>

<div class="carrusel-container">
<button class="nav prev" onclick="prev()">‹</button>
<img id="imgGrande">
<button class="nav next" onclick="next()">›</button>
</div>

<div class="bottom-bar">
<button class="btn-cerrar" onclick="modal.style.display='none'">Cerrar</button>
</div>

</div>

<script>
const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

const params=new URLSearchParams(window.location.search);
const clienteFiltro=(params.get("cliente")||"").toLowerCase();

document.getElementById("fecha").innerText=new Date().toLocaleDateString();

function formato(n){
  return Number(n).toLocaleString("es-PE",{minimumFractionDigits:2});
}

let imgs=[],i=0;

function abrirModal(src){
  imgs = src.split("|").map(x => x.trim());
  i = 0;
  imgGrande.src = imgs[i];
  modal.style.display="flex";
}

function next(){i=(i+1)%imgs.length;imgGrande.src=imgs[i];}
function prev(){i=(i-1+imgs.length)%imgs.length;imgGrande.src=imgs[i];}

/* 🔥 NUEVO: cerrar al tocar cualquier espacio vacío */
modal.addEventListener("click", function(e){
  if(
    !e.target.closest("img") &&
    !e.target.closest(".nav") &&
    !e.target.closest(".btn-cerrar") &&
    !e.target.closest(".volver")
  ){
    modal.style.display = "none";
  }
});

fetch(url)
.then(r=>r.text())
.then(csv=>{
const filas=csv.trim().split("\n").slice(1);

let totalGeneral=0,id=1;

filas.forEach(f=>{
const c=f.split(",");

if(c[0].toLowerCase()==clienteFiltro){

const precio=parseFloat(c[3])||0;
const subtotal=parseFloat(c[4])||0;

totalGeneral+=subtotal;

const tr=document.createElement("tr");

const img=document.createElement("img");
img.src=c[5].split("|")[0];
img.className="producto-img";
img.onclick=()=>abrirModal(c[5]);

tr.innerHTML=`
<td>${id}</td>
<td></td>
<td>${c[1]}</td>
<td>${c[2]}</td>
<td class="right">S/ ${formato(precio)}</td>
<td>S/ ${formato(subtotal)}</td>
`;

tr.children[1].appendChild(img);
tabla.appendChild(tr);

const card=document.createElement("div");
card.className="card";

const imgCard=document.createElement("img");
imgCard.src=c[5].split("|")[0];
imgCard.onclick=()=>abrirModal(c[5]);

const info=document.createElement("div");
info.className="card-info";
info.innerHTML=`
<h4>${c[2]}</h4>
<p>Cant: ${c[1]}</p>
<p>S/ ${formato(precio)}</p>
<p><b>S/ ${formato(subtotal)}</b></p>
`;

card.appendChild(imgCard);
card.appendChild(info);
cards.appendChild(card);

id++;
}
});

document.getElementById("cliente").innerText=clienteFiltro.toUpperCase();
document.getElementById("total_final").innerText=formato(totalGeneral);
document.getElementById("total_mobile").innerText=formato(totalGeneral);

});
</script>

</body>
</html>
