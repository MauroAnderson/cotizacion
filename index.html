<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SHOPnew - Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #0f172a, #1e40af);
}

/* CONTENEDOR */
.container {
  max-width: 1000px;
  margin: 30px auto;
  background: rgba(255,255,255,0.97);
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 6px;
  margin-bottom: 8px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(90deg,#2563eb,#06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.title {
  font-size: 14px;
  font-weight: 600;
  color: #374151;
}

/* CLIENTE */
.cliente-box {
  margin-top: 8px;
  background: #f8fafc;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
}

.cliente-nombre {
  font-size: 16px;
  font-weight: 700;
}

/* TABLA */
.tabla-responsive {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
  margin-top: 15px;
}

th {
  background: linear-gradient(90deg,#2563eb,#06b6d4);
  color: white;
  padding: 8px;
  font-size: 12px;
}

td {
  padding: 8px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}

tr:hover {
  background: #f9fafb;
}

td.id { width: 25px; font-size: 10px; }
td.cantidad { width: 50px; text-align: center; }
td.producto { width: 50%; font-weight: 600; }
td.right { text-align: right; }

img.producto-img {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
}

/* TOTAL */
tfoot td {
  font-size: 16px;
  font-weight: 800;
}

.total {
  text-align: right;
  color: #2563eb;
}

/* BOTÓN */
.btn {
  margin-top: 18px;
  padding: 10px 18px;
  background: linear-gradient(90deg,#2563eb,#06b6d4);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 92%;
  max-height: 92%;
  border-radius: 10px;
}

.cerrar {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 38px;
  color: white;
  cursor: pointer;
}

/* ===================== */
/* CARDS MOBILE */
/* ===================== */
.cards {
  display: none;
}

@media (max-width: 768px) {

  .tabla-responsive {
    display: none;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
  }

  .card {
    background: #f8fafc;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    gap: 10px;
  }

  .card img {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    object-fit: cover;
  }

  .card-info h4 {
    margin: 0;
    font-size: 14px;
  }

  .card-info p {
    margin: 2px 0;
    font-size: 12px;
  }

  .btn {
    width: 100%;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">SHOPnew</div>
    <div class="title">COTIZACIÓN</div>
  </div>

  <div class="cliente-box">
    <div>
      Cliente:<br>
      <span id="cliente" class="cliente-nombre"></span>
    </div>
    <div>
      Fecha:<br>
      <span id="fecha"></span>
    </div>
  </div>

  <!-- TABLA PC -->
  <div class="tabla-responsive">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Img</th>
          <th>Cant.</th>
          <th>Producto</th>
          <th class="right">Precio</th>
          <th class="right">Total</th>
        </tr>
      </thead>

      <tbody id="tabla"></tbody>

      <tfoot>
        <tr>
          <td colspan="5" class="total">TOTAL</td>
          <td class="total">S/ <span id="total_final">0</span></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- CARDS MOBILE -->
  <div class="cards" id="cards"></div>

  <button class="btn" onclick="window.print()">Descargar PDF</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="cerrar">&times;</span>
  <img id="imgGrande">
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

const params = new URLSearchParams(window.location.search);
const clienteFiltro = (params.get("cliente") || "").trim().toLowerCase();

document.getElementById("fecha").innerText = new Date().toLocaleDateString();

const modal = document.getElementById("modal");
const imgGrande = document.getElementById("imgGrande");
const btnCerrar = document.querySelector(".cerrar");

function abrirModal(src) {
  modal.style.display = "flex";
  imgGrande.src = src;
}

modal.addEventListener("click", () => modal.style.display = "none");
imgGrande.addEventListener("click", (e) => e.stopPropagation());
btnCerrar.addEventListener("click", () => modal.style.display = "none");

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") modal.style.display = "none";
});

fetch(url)
.then(res => res.text())
.then(csv => {

  const filas = csv.trim().split("\n").slice(1);

  let totalGeneral = 0;
  let id = 1;

  const tbody = document.getElementById("tabla");
  const cards = document.getElementById("cards");

  filas.forEach(fila => {

    const col = fila.split(",");

    const cliente = col[0]?.trim().toLowerCase();
    const cantidad = col[1];
    const producto = col[2];
    const precio = col[3];
    const total = col[4];
    const imagen = col[5];

    if (cliente === clienteFiltro) {

      const subtotal = parseFloat(total);

      /* TABLA PC */
      const tr = document.createElement("tr");

      const img = document.createElement("img");
      img.src = imagen;
      img.className = "producto-img";
      img.onerror = () => img.src = "https://via.placeholder.com/50";
      img.addEventListener("click", () => abrirModal(imagen));

      const tdImg = document.createElement("td");
      tdImg.appendChild(img);

      tr.innerHTML = `
        <td class="id">${id}</td>
        <td class="cantidad">${cantidad}</td>
        <td class="producto">${producto}</td>
        <td class="right">S/ ${precio}</td>
        <td class="right">S/ ${subtotal}</td>
      `;

      tr.insertBefore(tdImg, tr.children[1]);
      tbody.appendChild(tr);

      /* CARDS MOBILE */
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="${imagen}">
        <div class="card-info">
          <h4>${producto}</h4>
          <p>Cantidad: ${cantidad}</p>
          <p>Precio: S/ ${precio}</p>
          <p><b>Total: S/ ${subtotal}</b></p>
        </div>
      `;

      cards.appendChild(card);

      totalGeneral += subtotal;
      id++;
    }
  });

  document.getElementById("cliente").innerText = clienteFiltro.toUpperCase();
  document.getElementById("total_final").innerText = totalGeneral.toFixed(2);
});
</script>

</body>
</html>
