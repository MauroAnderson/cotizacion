<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SHOPnew - Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Inter',sans-serif;
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e40af);
}

/* CONTENEDOR */
.container{
  max-width:1000px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

/* HEADER RESTAURADO */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
  padding-bottom:6px;
  margin-bottom:8px;
}

.logo{
  font-size:22px;
  font-weight:800;
  background:linear-gradient(90deg,#2563eb,#06b6d4);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.title{
  font-size:14px;
  font-weight:600;
  color:#374151;
}

/* CLIENTE RESTAURADO */
.cliente-box{
  margin-top:8px;
  background:#f8fafc;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  display:flex;
  justify-content:space-between;
}

.cliente-nombre{
  font-size:15px;
  font-weight:700;
}

/* TABLA */
.tabla-responsive{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:600px;
  margin-top:15px;
  border-collapse:collapse;
}

th{
  background:#2563eb;
  color:#fff;
  padding:8px;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

.total{
  text-align:right;
  font-weight:bold;
  color:#2563eb;
}

img.producto-img{
  width:42px;
  cursor:pointer;
}

/* BOTÓN */
.btn{
  margin-top:15px;
  width:100%;
  padding:10px;
  background:#2563eb;
  color:#fff;
  border:none;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:black;
  flex-direction:column;
}

.carrusel-container{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal img{
  max-height:75vh;
}

.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
}

.prev{left:10px;}
.next{right:10px;}

/* CARDS */
.cards{display:none;}

.total-mobile{
  display:none;
  margin-top:10px;
  font-weight:bold;
  font-size:15px;
  text-align:right;
  color:#2563eb;
}

@media(max-width:768px){

  .tabla-responsive{display:none;}

  .cards{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:10px;
  }

  .card{
    display:flex;
    gap:8px;
    padding:8px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    align-items:center;
  }

  .card img{
    width:50px;
    height:50px;
  }

  .card-info{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  /* 🔥 TEXTO AJUSTADO (ni muy chico ni grande) */
  .card-info h4{
    margin:0;
    font-size:13px;
    line-height:1.2;
  }

  .card-info p{
    margin:0;
    font-size:11px;
    line-height:1.2;
  }

  .total-mobile{
    display:block;
  }

}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">SHOPnew</div>
<div class="title">COTIZACIÓN</div>
</div>

<div class="cliente-box">
<div>
Cliente:<br>
<span id="cliente" class="cliente-nombre"></span>
</div>
<div>
Fecha:<br>
<span id="fecha"></span>
</div>
</div>

<div class="tabla-responsive">
<table>
<thead>
<tr>
<th>#</th>
<th>Img</th>
<th>Cant</th>
<th>Producto</th>
<th>Precio</th>
<th>Total</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

<tfoot>
<tr>
<td colspan="5" class="total">TOTAL</td>
<td class="total">S/ <span id="total_final">0.00</span></td>
</tr>
</tfoot>

</table>
</div>

<div class="cards" id="cards"></div>

<div class="total-mobile">
TOTAL: S/ <span id="total_mobile">0.00</span>
</div>

<button class="btn" onclick="window.print()">PDF</button>

</div>

<div id="modal" class="modal">
<div style="padding:15px;color:white;">
<span onclick="modal.style.display='none'">← Volver</span>
</div>

<div class="carrusel-container">
<span class="nav prev" onclick="prev()">‹</span>
<img id="imgGrande">
<span class="nav next" onclick="next()">›</span>
</div>
</div>

<script>
const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

const params=new URLSearchParams(window.location.search);
const clienteFiltro=(params.get("cliente")||"").toLowerCase();

document.getElementById("fecha").innerText=new Date().toLocaleDateString();

let imgs=[],i=0;

function abrirModal(src){
  imgs=src.split("|");
  i=0;
  imgGrande.src=imgs[i];
  modal.style.display="flex";
}

function next(){i=(i+1)%imgs.length;imgGrande.src=imgs[i];}
function prev(){i=(i-1+imgs.length)%imgs.length;imgGrande.src=imgs[i];}

fetch(url)
.then(r=>r.text())
.then(csv=>{
const filas=csv.trim().split("\n").slice(1);

let totalGeneral=0,id=1;

filas.forEach(f=>{
const c=f.split(",");

if(c[0].toLowerCase()==clienteFiltro){

const subtotal=parseFloat(c[4])||0;
totalGeneral+=subtotal;

/* TABLA */
const tr=document.createElement("tr");

const img=document.createElement("img");
img.src=c[5].split("|")[0];
img.className="producto-img";
img.onclick=()=>abrirModal(c[5]);

tr.innerHTML=`
<td>${id}</td>
<td></td>
<td>${c[1]}</td>
<td>${c[2]}</td>
<td>S/ ${c[3]}</td>
<td>S/ ${subtotal}</td>
`;

tr.children[1].appendChild(img);
tabla.appendChild(tr);

/* CARD */
const card=document.createElement("div");
card.className="card";

const imgCard=document.createElement("img");
imgCard.src=c[5].split("|")[0];
imgCard.onclick=()=>abrirModal(c[5]);

const info=document.createElement("div");
info.className="card-info";
info.innerHTML=`
<h4>${c[2]}</h4>
<p>Cant: ${c[1]}</p>
<p>S/ ${c[3]}</p>
<p><b>${subtotal}</b></p>
`;

card.appendChild(imgCard);
card.appendChild(info);
cards.appendChild(card);

id++;
}
});

document.getElementById("cliente").innerText=clienteFiltro.toUpperCase();
document.getElementById("total_final").innerText=totalGeneral.toFixed(2);
document.getElementById("total_mobile").innerText=totalGeneral.toFixed(2);

});
</script>

</body>
</html>
