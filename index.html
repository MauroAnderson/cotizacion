<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SHOPnew - Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #0f172a, #1e40af);
}

.container {
  max-width: 1000px;
  margin: 30px auto;
  background: rgba(255,255,255,0.97);
  border-radius: 16px;
  padding: 22px;
}

.header {
  display: flex;
  justify-content: space-between;
}

.logo { font-weight: 800; }
.title { font-size: 14px; }

.cliente-box {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
}

.tabla-responsive {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 600px;
}

img.producto-img {
  width: 42px;
  cursor: pointer;
}

.cards { display: none; }

@media (max-width:768px){
  .tabla-responsive { display:none; }
  .cards {
    display:flex;
    flex-direction:column;
    gap:10px;
  }
}

/* ===== MODAL ===== */
.modal {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  z-index:999;
  flex-direction:column;
  justify-content:space-between;
}

.top-bar {
  color:white;
  padding:15px;
}

.bottom-bar {
  text-align:center;
  padding:15px;
}

.btn-cerrar {
  padding:10px 20px;
  border-radius:20px;
}

/* CARRUSEL */
.carrusel {
  display:flex;
  align-items:center;
  justify-content:center;
}

.carrusel img {
  max-width:90%;
  max-height:70vh;
}

.nav {
  font-size:40px;
  color:white;
  cursor:pointer;
  padding:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">SHOPnew</div>
<div class="title">COTIZACIÓN</div>
</div>

<div class="cliente-box">
<span id="cliente"></span>
<span id="fecha"></span>
</div>

<div class="tabla-responsive">
<table>
<thead>
<tr>
<th>#</th>
<th>Img</th>
<th>Cant</th>
<th>Producto</th>
<th>Precio</th>
<th>Total</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<div class="cards" id="cards"></div>

<button onclick="window.print()">PDF</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

<div class="top-bar">
<span onclick="cerrarModal()">← Volver</span>
</div>

<div class="carrusel">
<span class="nav" onclick="prev()">‹</span>
<img id="imgGrande">
<span class="nav" onclick="next()">›</span>
</div>

<div class="bottom-bar">
<button class="btn-cerrar" onclick="cerrarModal()">Cerrar</button>
</div>

</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

const params = new URLSearchParams(window.location.search);
const clienteFiltro = (params.get("cliente")||"").toLowerCase();

document.getElementById("fecha").innerText = new Date().toLocaleDateString();

let imagenes = [];
let index = 0;

function abrirModal(imgs){
  imagenes = imgs.split("|");
  index = 0;
  mostrar();
  modal.style.display="flex";
}

function mostrar(){
  document.getElementById("imgGrande").src = imagenes[index];
}

function next(){
  index = (index+1)%imagenes.length;
  mostrar();
}

function prev(){
  index = (index-1+imagenes.length)%imagenes.length;
  mostrar();
}

function cerrarModal(){
  modal.style.display="none";
}

fetch(url)
.then(r=>r.text())
.then(csv=>{
  const filas = csv.split("\n").slice(1);
  let id=1;

  filas.forEach(f=>{
    const c=f.split(",");
    if(c[0].toLowerCase()==clienteFiltro){

      const tr=document.createElement("tr");

      const img=document.createElement("img");
      img.src=c[5].split("|")[0];
      img.className="producto-img";
      img.onclick=()=>abrirModal(c[5]);

      tr.innerHTML=`
      <td>${id}</td>
      <td></td>
      <td>${c[1]}</td>
      <td>${c[2]}</td>
      <td>${c[3]}</td>
      <td>${c[4]}</td>
      `;

      tr.children[1].appendChild(img);
      document.getElementById("tabla").appendChild(tr);

      id++;
    }
  });

  document.getElementById("cliente").innerText = clienteFiltro.toUpperCase();
});
</script>

</body>
</html>
