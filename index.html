<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SHOPnew - Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #0f172a, #1e40af);
}

/* CONTENEDOR */
.container {
  max-width: 1000px;
  margin: 30px auto;
  background: rgba(255,255,255,0.97);
  border-radius: 16px;
  padding: 22px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.title {
  font-size: 14px;
}

/* CLIENTE */
.cliente-box {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
}

/* TABLA (PC) */
.table-container {
  margin-top: 15px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #2563eb;
  color: white;
  padding: 8px;
}

td {
  padding: 8px;
  border-bottom: 1px solid #eee;
}

img.producto-img {
  width: 42px;
  height: 42px;
  border-radius: 6px;
  cursor: pointer;
}

/* TOTAL */
.total-box {
  text-align: right;
  font-weight: bold;
  margin-top: 10px;
}

/* BOTÓN */
.btn {
  margin-top: 15px;
  width: 100%;
  padding: 10px;
  background: #2563eb;
  color: white;
  border: none;
}

/* ===================== */
/* MODO APP (CELULAR) */
/* ===================== */
@media (max-width: 768px) {

  table {
    display: none;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 15px;
  }

  .card {
    background: #f8fafc;
    padding: 12px;
    border-radius: 10px;
    display: flex;
    gap: 10px;
  }

  .card img {
    width: 60px;
    height: 60px;
    border-radius: 8px;
  }

  .card-info {
    flex: 1;
  }

  .card-info h4 {
    margin: 0;
    font-size: 14px;
  }

  .card-info p {
    margin: 2px 0;
    font-size: 12px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">SHOPnew</div>
    <div class="title">COTIZACIÓN</div>
  </div>

  <div class="cliente-box">
    <div>
      Cliente:<br>
      <span id="cliente"></span>
    </div>
    <div>
      Fecha:<br>
      <span id="fecha"></span>
    </div>
  </div>

  <!-- TABLA PC -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Img</th>
          <th>Cant.</th>
          <th>Producto</th>
          <th>Precio</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>

  <!-- CARDS MOBILE -->
  <div class="cards" id="cards"></div>

  <div class="total-box">
    TOTAL: S/ <span id="total_final">0</span>
  </div>

  <button class="btn" onclick="window.print()">Descargar PDF</button>

</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

const params = new URLSearchParams(window.location.search);
const clienteFiltro = (params.get("cliente") || "").trim().toLowerCase();

document.getElementById("fecha").innerText = new Date().toLocaleDateString();

fetch(url)
.then(res => res.text())
.then(csv => {

  const filas = csv.trim().split("\n").slice(1);

  let totalGeneral = 0;
  let id = 1;

  const tbody = document.getElementById("tabla");
  const cards = document.getElementById("cards");

  filas.forEach(fila => {

    const col = fila.split(",");

    const cliente = col[0]?.trim().toLowerCase();
    const cantidad = col[1];
    const producto = col[2];
    const precio = col[3];
    const total = col[4];
    const imagen = col[5];

    if (cliente === clienteFiltro) {

      const subtotal = parseFloat(total);

      /* TABLA PC */
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${id}</td>
        <td><img src="${imagen}" class="producto-img"></td>
        <td>${cantidad}</td>
        <td>${producto}</td>
        <td>S/ ${precio}</td>
        <td>S/ ${subtotal}</td>
      `;

      tbody.appendChild(tr);

      /* CARDS MOBILE */
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="${imagen}">
        <div class="card-info">
          <h4>${producto}</h4>
          <p>Cantidad: ${cantidad}</p>
          <p>Precio: S/ ${precio}</p>
          <p><b>Total: S/ ${subtotal}</b></p>
        </div>
      `;

      cards.appendChild(card);

      totalGeneral += subtotal;
      id++;
    }
  });

  document.getElementById("cliente").innerText = clienteFiltro.toUpperCase();
  document.getElementById("total_final").innerText = totalGeneral.toFixed(2);

});
</script>

</body>
</html>
