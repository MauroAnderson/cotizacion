<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 950px;
  margin: auto;
  background: #fff;
  border-radius: 14px;
  padding: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: 600;
  color: #2563eb;
}

.info {
  margin-top: 15px;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th {
  background: #2563eb;
  color: white;
  padding: 10px;
  font-size: 14px;
}

td {
  padding: 10px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

td.right {
  text-align: right;
}

td.center {
  text-align: center;
}

img {
  width: 45px;
  height: 45px;
  object-fit: cover;
  border-radius: 6px;
}

tfoot td {
  font-weight: 600;
  font-size: 16px;
}

.total {
  text-align: right;
  color: #2563eb;
}

.btn {
  margin-top: 20px;
  padding: 10px 18px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.btn:hover {
  background: #1e40af;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">UTANI</div>
    <div>COTIZACIÓN</div>
  </div>

  <div class="info">
    <div>Cliente: <strong id="cliente"></strong></div>
    <div>Fecha: <span id="fecha"></span></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Img</th>
        <th>Producto</th>
        <th>Cant.</th>
        <th class="right">Precio</th>
        <th class="right">Total</th>
      </tr>
    </thead>

    <tbody id="tabla"></tbody>

    <tfoot>
      <tr>
        <td colspan="5" class="total">TOTAL</td>
        <td class="total">S/ <span id="total_final">0</span></td>
      </tr>
    </tfoot>
  </table>

  <button class="btn" onclick="window.print()">Descargar PDF</button>

</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

const params = new URLSearchParams(window.location.search);
const clienteFiltro = (params.get("cliente") || "").trim().toLowerCase();

document.getElementById("fecha").innerText = new Date().toLocaleDateString();

fetch(url)
.then(res => res.text())
.then(csv => {

  const filas = csv.trim().split("\n").slice(1);

  let totalGeneral = 0;
  let id = 1;

  const tbody = document.getElementById("tabla");

  filas.forEach(fila => {

    const col = fila.split(",");

    const cliente = col[0]?.trim().toLowerCase();
    const cantidad = col[1];
    const producto = col[2];
    const precio = col[3];
    const total = col[4];
    const imagen = col[5];

    if (cliente === clienteFiltro) {

      const subtotal = parseFloat(total);

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td class="center">${id++}</td>
        <td><img src="${imagen}" onerror="this.style.display='none'"></td>
        <td>${producto}</td>
        <td class="center">${cantidad}</td>
        <td class="right">S/ ${precio}</td>
        <td class="right">S/ ${subtotal}</td>
      `;

      tbody.appendChild(tr);

      totalGeneral += subtotal;
    }
  });

  document.getElementById("cliente").innerText = clienteFiltro;
  document.getElementById("total_final").innerText = totalGeneral.toFixed(2);
});
</script>

</body>
</html>
