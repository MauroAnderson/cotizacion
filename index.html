<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SHOPnew - Cotización</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: #111;
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 26px;
  font-weight: 700;
  background: linear-gradient(90deg,#2563eb,#06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.info {
  margin-top: 15px;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  color: #444;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 25px;
}

th {
  background: linear-gradient(90deg,#2563eb,#06b6d4);
  color: white;
  padding: 12px;
  font-size: 13px;
}

td {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

tr:hover {
  background: #f1f5f9;
}

td.id {
  width: 30px;
  font-size: 11px;
  color: #888;
}

td.producto {
  width: 45%;
  font-weight: 600;
}

td.cantidad {
  width: 60px;
  text-align: center;
}

td.right {
  text-align: right;
}

img {
  width: 45px;
  height: 45px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

img:hover {
  transform: scale(1.1);
}

tfoot td {
  font-size: 18px;
  font-weight: 700;
}

.total {
  text-align: right;
  color: #2563eb;
}

.btn {
  margin-top: 25px;
  padding: 12px 20px;
  background: linear-gradient(90deg,#2563eb,#06b6d4);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* MODAL MEJORADO */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(255,255,255,0.2);
}

.modal.show {
  display: flex;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">SHOPnew</div>
    <div>COTIZACIÓN</div>
  </div>

  <div class="info">
    <div>Cliente: <strong id="cliente"></strong></div>
    <div>Fecha: <span id="fecha"></span></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Img</th>
        <th>Cantidad</th>
        <th>Producto</th>
        <th class="right">Precio</th>
        <th class="right">Total</th>
      </tr>
    </thead>

    <tbody id="tabla"></tbody>

    <tfoot>
      <tr>
        <td colspan="5" class="total">TOTAL</td>
        <td class="total">S/ <span id="total_final">0</span></td>
      </tr>
    </tfoot>
  </table>

  <button class="btn" onclick="window.print()">Descargar PDF</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
  <img id="imgGrande">
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8ZtbK9OCo6gEqklNWN98PT8NIIi7nQQos5QJuztDNr6Di3ZS41mviOJwSjNsnFrOuk03MU3aF18K8/pub?output=csv";

const params = new URLSearchParams(window.location.search);
const clienteFiltro = (params.get("cliente") || "").trim().toLowerCase();

document.getElementById("fecha").innerText = new Date().toLocaleDateString();

fetch(url)
.then(res => res.text())
.then(csv => {

  const filas = csv.trim().split("\n").slice(1);

  let totalGeneral = 0;
  let id = 1;

  const tbody = document.getElementById("tabla");

  filas.forEach(fila => {

    const col = fila.split(",");

    const cliente = col[0]?.trim().toLowerCase();
    const cantidad = col[1];
    const producto = col[2];
    const precio = col[3];
    const total = col[4];
    const imagen = col[5];

    if (cliente === clienteFiltro) {

      const subtotal = parseFloat(total);

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td class="id">${id++}</td>
        <td><img src="${imagen}" onclick="verImagen('${imagen}')" onerror="this.style.display='none'"></td>
        <td class="cantidad">${cantidad}</td>
        <td class="producto">${producto}</td>
        <td class="right">S/ ${precio}</td>
        <td class="right">S/ ${subtotal}</td>
      `;

      tbody.appendChild(tr);

      totalGeneral += subtotal;
    }
  });

  document.getElementById("cliente").innerText = clienteFiltro;
  document.getElementById("total_final").innerText = totalGeneral.toFixed(2);
});

function verImagen(src) {
  document.getElementById("modal").classList.add("show");
  document.getElementById("imgGrande").src = src;
}

function cerrarModal() {
  document.getElementById("modal").classList.remove("show");
}
</script>

</body>
</html>
